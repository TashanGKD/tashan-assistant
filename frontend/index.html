<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>他山助手</title>
<style>
:root{
  --bg:#f6f7fa;--panel:#fff;--text:#182033;--muted:#758096;--line:#e5e9f0;
  --brand:#2351d8;--soft:#eef3ff;--ok:#167a49;--okbg:#ebf8f1;
  --bad:#b53243;--badbg:#fff0f2;--shadow:0 16px 44px rgba(32,50,90,.08)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,textarea{font:inherit}button{cursor:pointer}
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px;font-weight:850}.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#748af0);display:grid;place-items:center;color:#fff;font-weight:900}
.shell{max-width:1120px;margin:0 auto;padding:34px 22px 54px}.hero{padding:28px 4px 22px}.hero h1{font-size:31px;margin:0 0 9px}.hero p{margin:0;color:var(--muted);font-size:15px}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.course{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;min-height:142px;display:flex;flex-direction:column;box-shadow:0 3px 14px rgba(25,44,85,.025);transition:.16s}
.course:hover{transform:translateY(-2px);border-color:#c8d3fa;box-shadow:var(--shadow)}.num{font-size:12px;font-weight:800;color:var(--brand);background:var(--soft);padding:5px 9px;border-radius:999px;align-self:flex-start}
.course h3{font-size:16.5px;line-height:1.5;margin:13px 0 18px;font-weight:760}.enter{margin-top:auto;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:10px 14px;font-weight:750}.enter:hover{background:#1c45bf}
.chat-shell{max-width:980px;margin:0 auto;padding:20px 18px;height:calc(100vh - 62px)}.chat{height:100%;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(27,43,77,.05);display:flex;flex-direction:column;overflow:hidden}
.chat-head{min-height:70px;border-bottom:1px solid var(--line);padding:10px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.icon-btn,.new-chat{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-weight:700}.icon-btn{color:#536079}.new-chat{color:var(--brand);border-color:#cbd5f5}.icon-btn:hover,.new-chat:hover{background:var(--soft);color:var(--brand)}
.head-center{min-width:0}.head-title{font-weight:850;font-size:15px}.head-sub{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.messages{flex:1;overflow:auto;padding:26px 26px 14px;scroll-behavior:smooth}.welcome{max-width:680px;margin:16px auto 28px;text-align:center}.welcome h2{font-size:24px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 18px;line-height:1.6}
.starters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.starter{border:1px solid var(--line);background:#fff;color:#58647a;border-radius:999px;padding:8px 12px;font-size:13px}.starter:hover{border-color:#bcc9f8;background:#f7f9ff;color:var(--brand)}
.msg{display:flex;margin:0 0 18px}.msg.user{justify-content:flex-end}.msg-body{max-width:82%}.bubble{padding:13px 15px;border-radius:15px;line-height:1.7;font-size:14px;word-break:break-word}
.assistant .bubble{background:#f3f6fa;border-top-left-radius:5px}.user .bubble{background:var(--brand);color:#fff;border-top-right-radius:5px;white-space:pre-wrap}
.msg-tools{margin:6px 2px 0;display:flex;gap:8px}.msg-tools button{border:0;background:transparent;color:#8791a4;padding:3px 5px;font-size:12px}.msg-tools button:hover{color:var(--brand)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#e9edf4;border-radius:5px;padding:2px 5px;font-size:.93em}
pre{position:relative;margin:10px 0;background:#171b25;color:#edf1f7;border-radius:10px;padding:14px;overflow:auto;line-height:1.55}pre code{background:transparent;padding:0;color:inherit;white-space:pre;font-size:12.5px}
.code-copy{position:absolute;right:8px;top:8px;border:1px solid #444b5c!important;background:#252b38!important;color:#cbd2df!important;border-radius:6px!important;padding:4px 7px!important;font-size:11px!important}
.md-line{margin:2px 0}.feedback-row{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 4px}.feedback-row button{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:9px;color:#59657a;font-size:12.5px}
.feedback-row button:hover{border-color:#b9c6f4;color:var(--brand);background:#f8faff}.feedback-row .resolved:hover{border-color:#b8e5cd;color:var(--ok);background:var(--okbg)}.feedback-row .bad:hover{border-color:#efc4ca;color:var(--bad);background:var(--badbg)}.feedback-row button:disabled{opacity:.45;cursor:default}
.inline-feedback{margin:8px 0 20px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.inline-feedback textarea{width:100%;min-height:82px;border:0;outline:0;resize:vertical;line-height:1.6;color:var(--text)}
.inline-actions{display:flex;justify-content:flex-end;gap:8px}.inline-actions button{border:0;border-radius:8px;padding:8px 12px}.inline-actions .cancel{background:#f0f2f6;color:#637087}.inline-actions .send{background:var(--brand);color:#fff}
.typing{display:flex;align-items:center;gap:4px;padding:14px 16px;background:#f3f6fa;border-radius:15px;border-top-left-radius:5px;width:max-content}.dot{width:6px;height:6px;border-radius:50%;background:#8d98aa;animation:pulse 1.1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
.resolved-card{margin:10px 0 20px;border:1px solid #c5ead7;background:var(--okbg);color:var(--ok);border-radius:12px;padding:13px 14px;display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:13px;font-weight:700}.resolved-card button{border:0;background:var(--ok);color:#fff;border-radius:8px;padding:8px 11px;font-weight:750}
.status-chip{display:inline-block;font-size:11px;font-weight:800;margin-bottom:5px;padding:3px 7px;border-radius:999px;background:#e9efff;color:var(--brand)}
.composer-wrap{border-top:1px solid var(--line);padding:12px 16px 14px;background:#fff}.composer{border:1px solid var(--line);background:#f8f9fb;border-radius:13px;padding:9px 9px 8px 12px;display:flex;gap:9px;align-items:flex-end}.composer:focus-within{border-color:#bdc9f4;box-shadow:0 0 0 3px rgba(35,81,216,.06)}
.composer textarea{flex:1;border:0;background:transparent;outline:0;resize:none;min-height:40px;max-height:160px;line-height:1.55;color:var(--text)}.send-btn{width:41px;height:41px;border:0;background:var(--brand);color:#fff;border-radius:10px;font-size:18px;font-weight:800}.send-btn:disabled{opacity:.42;cursor:default}
.composer-meta{display:flex;justify-content:space-between;gap:14px;color:#8a94a6;font-size:11px;padding:7px 3px 0}.privacy{max-width:72%}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2431;color:#fff;border-radius:9px;padding:9px 13px;font-size:12px;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:820px){.course-grid{grid-template-columns:1fr 1fr}.chat-shell{padding:10px;height:calc(100vh - 62px)}.chat{border-radius:14px}.messages{padding:20px 15px 10px}.msg-body{max-width:92%}}
@media(max-width:560px){.topbar{padding:0 14px}.shell{padding:22px 12px 40px}.hero h1{font-size:27px}.course-grid{grid-template-columns:1fr}.chat-head{padding:8px 10px}.head-sub{max-width:180px}.new-chat{font-size:0;padding:8px 10px}.new-chat:after{content:"＋";font-size:18px}.composer-meta{display:none}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="logo">他</div><span>他山助手</span></div></header>
<main id="app"></main>
<div id="toast" class="toast"></div>

<script>
const LESSONS=[{"id": 1, "title": "科研智能体专题实训（一）：从零搭建智能体", "topics": ["大模型、固定工作流与智能体的边界", "上下文、工具、状态与 ReAct 执行循环", "动手搭建可调用工具的最小科研智能体"]}, {"id": 2, "title": "科研智能体专题实训（二）：智能体记忆与知识库", "topics": ["上下文、任务轨迹、跨会话记忆与 Skill 的关系", "科研 RAG：分块、混合检索、重排序与质量评估", "搭建具备记忆和知识检索能力的科研助手"]}, {"id": 3, "title": "科研智能体专题实训（三）：科研工具调用与工作流搭建", "topics": ["工具、工作流与 Skill 的区别及组合方式", "走通文献检索、论文解析、知识库、数据整理与绘图链路", "将可复用步骤沉淀为 Skill 或工作流模板"]}, {"id": 4, "title": "AI4S 专题实训（一）：从科学问题到 AI-ready 任务", "topics": ["将科学问题重述为输入、目标与边界明确的机器学习任务", "区分学习范式与任务类型，确定建模路径与模型选型", "判断物理约束、数据驱动与人工判断的分工"]}, {"id": 5, "title": "AI4S 专题实训（二）：构建科研数据 Harness——从科研文献到可信的 AI-ready 数据集", "topics": ["走通探索性数据分析、预处理、基线、训练、评测与报告", "按数据规模、标注条件、算力与解释需求等判据选型", "比较规范流程与直接演示，建立可信、可复现基线"]}, {"id": 6, "title": "科学模型专题实训（一）：从线性回归理解学习与模型结构", "topics": ["从线性回归理解数据、损失函数、训练和验证", "认识线性模型、深度网络、注意力与 Transformer 的结构差异", "建立“数据表征—骨干模型—训练目标—评价”的基本框架"]}, {"id": 7, "title": "科学模型专题实训（二）：从科学数据到模型选型与可信评测", "topics": ["以图像、时序、表格、图/分子结构等科学数据比较选型", "结合数据规模、先验、对称性、时空相关性和可解释性确定基线", "以评价指标、误差分析和外部验证检验模型可信性"]}, {"id": 8, "title": "Agent4S 专题实训（一）：从科研任务到可调用能力——CLI、Skill 与智能体工作流", "topics": ["以真实科研智能体案例引入可调用能力和自动化科研任务", "解释 CLI、Skill、MCP 与上下文的角色及可组合性", "在模拟科研环境中封装或调用 CLI，完成一个可验收的科研任务"]}, {"id": 9, "title": "Agent4S 专题实训（二）：从一次运行到持续科研——长时任务、评价闭环与人工接管", "topics": ["长时任务的状态外部化、上下文管理、保活与故障恢复", "质量门、验收标准、可验证任务与结果追踪", "版本管理、备份、人工接管与课题组协作机制"]}];
const DEMO=location.protocol==='file:';
const SESSION_PREFIX='tashan_session_';
const CLIENT_KEY='tashan_client_id';
let state={lesson:null,caseId:null,recordId:null,history:[],waiting:false,resolved:false,restored:false};

function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function now(){return new Date().toISOString()}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function scrollBottom(){const m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight}
function clientId(){
  let id=localStorage.getItem(CLIENT_KEY);
  if(!id){
    id=(crypto.randomUUID?crypto.randomUUID():'browser-'+Math.random().toString(36).slice(2)+Date.now());
    localStorage.setItem(CLIENT_KEY,id);
  }
  return id;
}
function key(id){return SESSION_PREFIX+id}
function saveSession(){
  if(!state.lesson)return;
  localStorage.setItem(key(state.lesson.id),JSON.stringify({
    caseId:state.caseId,recordId:state.recordId,history:state.history,resolved:state.resolved,updatedAt:now()
  }));
}
function loadSession(id){try{return JSON.parse(localStorage.getItem(key(id))||'null')}catch{return null}}
function clearSession(id){localStorage.removeItem(key(id))}

function showCourses(){
  state={lesson:null,caseId:null,recordId:null,history:[],waiting:false,resolved:false,restored:false};
  document.getElementById('app').innerHTML=`
    <div class="shell">
      <section class="hero"><h1>选择课程</h1><p>选择你正在参加的课程，进入他山助手。</p></section>
      <section class="course-grid">${LESSONS.map(l=>`
        <article class="course">
          <span class="num">第 ${l.id} 课</span>
          <h3>${esc(l.title)}</h3>
          <button class="enter" onclick="enterLesson(${l.id})">进入助手</button>
        </article>`).join('')}</section>
    </div>`;
}

function enterLesson(id){
  state.lesson=LESSONS.find(x=>x.id===id);
  const old=loadSession(id);
  if(old&&old.history?.length&&!old.resolved){
    state.caseId=old.caseId||null;state.recordId=old.recordId||null;state.history=old.history||[];
    state.resolved=false;state.restored=true;
  }else{
    state.caseId=null;state.recordId=null;state.history=[];state.resolved=false;state.restored=false;
    if(old?.resolved)clearSession(id);
  }
  renderChat();
  if(state.restored)toast('已恢复上次未完成的对话');
}

function renderMarkdown(raw){
  raw=String(raw??'').replace(/\\n/g,'\n');
  const blocks=[];
  raw=raw.replace(/```([^\n]*)\n([\s\S]*?)```/g,(_,lang,code)=>{
    const id=blocks.length;blocks.push({lang:(lang||'').trim(),code});return `@@CODE_${id}@@`;
  });
  let safe=esc(raw)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/^(\d+)\.\s+(.+)$/gm,'<div class="md-line">$1. $2</div>')
    .replace(/^[-*]\s+(.+)$/gm,'<div class="md-line">• $1</div>')
    .replace(/\n/g,'<br>');
  return safe.replace(/@@CODE_(\d+)@@/g,(_,n)=>{
    const b=blocks[Number(n)];
    return `<pre><button class="code-copy" onclick="copyCode(this)">复制</button><code>${esc(b.code.replace(/\n$/,''))}</code></pre>`;
  });
}
async function copyText(text,msg){
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}
    else{
      const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';
      document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
    }
    toast(msg);
  }catch{toast('复制失败，请手动复制')}
}
function copyCode(btn){copyText(btn.parentElement.querySelector('code').innerText,'代码已复制')}
function copyMessage(btn){copyText(btn.closest('.msg-body').querySelector('.bubble').innerText,'回答已复制')}

function renderChat(){
  const l=state.lesson;
  document.getElementById('app').innerHTML=`
    <div class="chat-shell"><section class="chat">
      <div class="chat-head">
        <button class="icon-btn" onclick="showCourses()">← 返回</button>
        <div class="head-center"><div class="head-title">他山助手 · 第 ${l.id} 课</div><div class="head-sub">${esc(l.title)}</div></div>
        <button class="new-chat" onclick="newConversation()">＋ 新对话</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="composer" placeholder="${state.resolved?'该问题已解决，请点击“新对话”开始新的问题':'描述问题或粘贴报错……'}"
            oninput="autoGrow(this)" onkeydown="composerKey(event)" ${state.resolved?'disabled':''}></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMain()" ${state.resolved?'disabled':''}>↑</button>
        </div>
        <div class="composer-meta">
          <span class="privacy">请勿粘贴 API Key、密码或不应外传的敏感科研数据。</span>
          <span>Enter 发送 · Shift + Enter 换行</span>
        </div>
      </div>
    </section></div>`;
  renderConversation();
}

function renderConversation(){
  const box=document.getElementById('messages');box.innerHTML='';
  if(!state.history.length){
    box.innerHTML=`
      <div class="welcome">
        <h2>Hi，有什么可以帮你？</h2>
        <p>我可以解答课程疑惑，也可以帮你排查 AI 工具、代码、环境和工作流问题。</p>
        <div class="starters">
          <button class="starter" onclick="starter('error')">我遇到报错</button>
          <button class="starter" onclick="starter('concept')">我没听懂一个概念</button>
          <button class="starter" onclick="starter('install')">工具/插件不会安装</button>
          <button class="starter" onclick="starter('ai')">AI 回答不符合预期</button>
        </div>
      </div>`;
  }else{
    state.history.forEach((m,i)=>{
      const latestAssistant=!state.resolved&&i===state.history.length-1&&m.role==='assistant';
      appendMessage(m.role,m.content,'',latestAssistant);
    });
  }
  if(state.resolved)appendResolvedCard(false);
  scrollBottom();
}
function starter(type){
  const ta=document.getElementById('composer');
  const templates={
    error:'我遇到了这个报错：\n\n',
    concept:'我没理解这个概念：',
    install:'我在安装/配置这个工具时遇到问题：',
    ai:'我希望 AI 完成这个任务，但现在结果不符合预期：\n\n目标：\n当前结果：'
  };
  ta.value=templates[type]||'';autoGrow(ta);ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
}
function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px'}
function composerKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMain()}}

function appendMessage(role,text,label='',withFeedback=true){
  const box=document.getElementById('messages'),wrap=document.createElement('div'),body=document.createElement('div');
  wrap.className='msg '+role;body.className='msg-body';
  if(role==='assistant'){
    body.innerHTML=`<div class="bubble">${label?`<span class="status-chip">${esc(label)}</span><br>`:''}${renderMarkdown(text)}</div>
      <div class="msg-tools"><button onclick="copyMessage(this)">复制回答</button></div>`;
  }else{
    body.innerHTML=`<div class="bubble">${label?`<span class="status-chip" style="background:rgba(255,255,255,.18);color:#fff">${esc(label)}</span><br>`:''}${esc(text)}</div>`;
  }
  wrap.appendChild(body);box.appendChild(wrap);
  if(role==='assistant'&&withFeedback)addFeedbackButtons();
  scrollBottom();
}
function addFeedbackButtons(){
  const box=document.getElementById('messages'),row=document.createElement('div');row.className='feedback-row';
  row.innerHTML=`<button class="resolved" onclick="resolveCase()">✓ 解决了</button>
    <button onclick="openInline(this,'unresolved')">还没解决</button>
    <button class="bad" onclick="openInline(this,'flagged')">回答有问题</button>`;
  box.appendChild(row);
}
function disableFeedback(){document.querySelectorAll('.feedback-row button').forEach(b=>b.disabled=true)}
function showTyping(){
  const box=document.getElementById('messages'),d=document.createElement('div');d.id='typing';d.className='msg assistant';
  d.innerHTML='<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';box.appendChild(d);scrollBottom();
}
function hideTyping(){document.getElementById('typing')?.remove()}

function demoAnswer(text,interaction='normal'){
  const low=text.toLowerCase();
  if(interaction==='flagged_followup')return '你指出上一轮回答有问题，我先不沿用上一轮结论。请把你认为错误的那一句/命令和当前真实现象放在一起，我会先复核版本、参数和前提，再给新的方案。';
  if(interaction==='unresolved_followup')return '上一轮没有解决，这次不重复原方案。请贴出执行上一轮步骤后的最新输出，尤其是第一条新的错误信息；如果没有报错，也说明执行后发生了什么。';
  if(low.includes('command not found')||text.includes('找不到命令'))return '先确认安装是否成功，以及可执行文件是否进入 PATH。\n\n```bash\nwhich <命令>\n# Windows 使用：\nwhere <命令>\n```\n\n把安装命令和完整报错贴出来，我继续定位。';
  if(low.includes('mcp')||low.includes('connection refused'))return '先不要继续改 Prompt，先确认 MCP 服务是否真的启动：\n\n1. 检查服务进程；\n2. 检查客户端配置中的地址和端口；\n3. 找到日志里第一条 `connection refused` 对应的地址。\n\n把配置片段和那几行报错贴来。';
  if(['pip','conda','module','python'].some(x=>low.includes(x)))return '先排除最常见的 Python 环境混用。\n\n```bash\npython -c "import sys; print(sys.executable)"\npython -m pip -V\n```\n\n两条输出应该指向同一套环境。把输出贴来即可继续。';
  return '请尽量补齐这 4 项：\n\n1. 你想完成什么；\n2. 你刚刚做了哪一步；\n3. 完整报错或异常现象；\n4. 使用的工具与版本。\n\n已有报错时直接原样粘贴，不要只发最后一行。';
}

async function sendMain(){
  if(state.waiting||state.resolved)return;
  const ta=document.getElementById('composer'),text=ta.value.trim();if(!text)return;
  ta.value='';autoGrow(ta);await sendTurn(text,'','normal');
}
async function sendTurn(text,label,interactionType){
  disableFeedback();appendMessage('user',text,label,false);
  state.waiting=true;document.getElementById('sendBtn').disabled=true;showTyping();
  let answer='';
  try{
    if(DEMO){
      await new Promise(r=>setTimeout(r,450));
      answer=demoAnswer(text,interactionType);
      if(!state.caseId){state.caseId='TS-DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase();state.recordId='local-demo'}
    }else{
      const response=await fetch('/api/chat',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          lesson_id:state.lesson.id,client_id:clientId(),message:text,
          case_id:state.caseId,record_id:state.recordId,history:state.history,
          interaction_type:interactionType
        })
      });
      if(!response.ok)throw new Error(await response.text());
      const data=await response.json();state.caseId=data.case_id;state.recordId=data.record_id;answer=data.answer;
    }
    state.history.push({role:'user',content:text},{role:'assistant',content:answer});
    state.resolved=false;saveSession();hideTyping();appendMessage('assistant',answer,'',true);
  }catch(error){
    hideTyping();appendMessage('assistant','服务暂时不可用，请稍后重试。\n\n'+String(error),'',false);
  }finally{
    state.waiting=false;const b=document.getElementById('sendBtn');if(b&&!state.resolved)b.disabled=false;
  }
}

async function resolveCase(){
  disableFeedback();await postFeedback('resolved','');
  state.resolved=true;saveSession();
  const ta=document.getElementById('composer'),btn=document.getElementById('sendBtn');
  if(ta){ta.disabled=true;ta.placeholder='该问题已解决，请点击“新对话”开始新的问题';ta.value=''}
  if(btn)btn.disabled=true;
  appendResolvedCard(true);
}
function appendResolvedCard(scroll=true){
  const box=document.getElementById('messages'),c=document.createElement('div');c.className='resolved-card';
  c.innerHTML='<span>✓ 已解决，感谢您使用我们的服务。</span><button onclick="newConversation(true)">开始新问题</button>';
  box.appendChild(c);if(scroll)scrollBottom();
}
function openInline(btn,type){
  document.querySelector('.inline-feedback')?.remove();
  const div=document.createElement('div');div.className='inline-feedback';
  const placeholder=type==='flagged'?'反馈意见：请指出上一轮回答哪里有问题':'请点击输入遇到的后续问题';
  div.innerHTML=`<textarea id="inlineText" placeholder="${placeholder}"></textarea>
    <div class="inline-actions"><button class="cancel" onclick="this.closest('.inline-feedback').remove()">取消</button>
    <button class="send" onclick="submitInline('${type}')">确认</button></div>`;
  btn.parentElement.after(div);document.getElementById('inlineText').focus();scrollBottom();
}
async function submitInline(type){
  const ta=document.getElementById('inlineText'),text=ta.value.trim();if(!text)return;
  ta.closest('.inline-feedback').remove();
  await postFeedback(type,text);
  await sendTurn(text,type==='flagged'?'回答有问题':'还没解决',type==='flagged'?'flagged_followup':'unresolved_followup');
}
async function postFeedback(type,text){
  if(DEMO)return;
  const response=await fetch('/api/feedback',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      lesson_id:state.lesson.id,client_id:clientId(),case_id:state.caseId,record_id:state.recordId,
      feedback_type:type,text,history:state.history
    })
  });
  if(!response.ok)throw new Error(await response.text());
}
async function newConversation(force=false){
  if(state.waiting)return;
  const unfinished=state.history.length&&!state.resolved;
  if(!force&&unfinished&&!confirm('开启新对话？当前问题将不再继续追问，但已经提交的记录不会丢失。'))return;
  if(unfinished&&state.caseId){try{await postFeedback('abandoned','用户主动开启新对话')}catch(error){console.warn(error)}}
  clearSession(state.lesson.id);
  state.caseId=null;state.recordId=null;state.history=[];state.resolved=false;state.restored=false;renderChat();
}

showCourses();
</script>
