name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare production environment
        shell: bash
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          set -Eeuo pipefail
          if [ -z "$DEPLOY_ENV" ]; then
            echo "DEPLOY_ENV secret is empty." >&2
            exit 1
          fi
          encoded="$(printf '%s' "$DEPLOY_ENV" | base64 | tr -d '\n')"
          echo "::add-mask::$encoded"
          printf 'DEPLOY_ENV_B64=%s\n' "$encoded" >> "$GITHUB_ENV"

      - name: Deploy to world.tashan.chat
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0
        env:
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          DEPLOY_ENV_B64: ${{ env.DEPLOY_ENV_B64 }}
          DEPLOY_REQUIRE_FEISHU: "0"
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: REPO,TARGET_SHA,DEPLOY_ENV_B64,DEPLOY_REQUIRE_FEISHU
          timeout: 30m
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            base_dir="${{ secrets.DEPLOY_PATH || '/var/www/github-actions/repos' }}"
            repo_name="${REPO##*/}"
            repo_dir="${base_dir}/${repo_name}"
            repo_url="https://github.com/${REPO}.git"

            if [ ! -d "${repo_dir}/.git" ]; then
              mkdir -p "$base_dir"
              git clone "$repo_url" "$repo_dir"
            fi

            cd "$repo_dir"
            git remote set-url origin "$repo_url"
            git fetch --prune origin main
            previous_sha="$(sed -n '1p' .deploy/current-sha 2>/dev/null || true)"
            git checkout --detach "$TARGET_SHA"

            umask 077
            env_file="$(mktemp "$repo_dir/.env.deploy.XXXXXX")"
            trap 'rm -f "$env_file"' EXIT
            printf '%s' "$DEPLOY_ENV_B64" | base64 --decode > "$env_file"

            for key in LLM_API_URL LLM_API_KEY LLM_MODEL ADMIN_TOKEN; do
              if ! grep -qE "^${key}=.+" "$env_file"; then
                echo "Required production setting ${key} is missing from DEPLOY_ENV." >&2
                exit 1
              fi
            done

            configured_admin="$(sed -n 's/^ADMIN_TOKEN=//p' "$env_file" | tail -n 1)"
            if [[ "$configured_admin" == *"replace-with"* \
              || "$configured_admin" == *"your_key"* \
              || "$configured_admin" == "change-me-before-production" ]]; then
              existing_admin="$(sed -n 's/^ADMIN_TOKEN=//p' .env 2>/dev/null | tail -n 1 || true)"
              if [ -z "$existing_admin" ] \
                || [[ "$existing_admin" == *"replace-with"* ]] \
                || [[ "$existing_admin" == *"your_key"* ]] \
                || [ "$existing_admin" = "change-me-before-production" ]; then
                existing_admin="$(openssl rand -hex 32)"
              fi
              sed -i "s/^ADMIN_TOKEN=.*/ADMIN_TOKEN=${existing_admin}/" "$env_file"
            fi

            chmod 600 "$env_file"
            mv "$env_file" .env
            trap - EXIT

            chmod +x scripts/deploy.sh
            scripts/deploy.sh "$previous_sha" "$TARGET_SHA"
